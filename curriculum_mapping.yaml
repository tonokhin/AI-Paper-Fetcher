# Maps ai-paper-fetcher topics to external curriculum concept ids.
#
# This file is the first integration boundary between the two projects:
# ai-paper-fetcher owns paper discovery/ranking, while a downstream curriculum
# system owns concept prerequisites and learner readiness. Exporters can use
# this mapping to emit curriculum Resource YAML with the right `covers` values.
#
# Stage marks the intended curriculum layer for papers from the topic. These
# are research/postgraduate resources by default, so generated resources should
# generally be shown behind an explicit research/paper mode in the curriculum.

topics:
  # Foundational paper collections from foundational_papers.yaml.
  foundations_transformers:
    covers:
      - transformers-and-llms
    stage: graduate
    role: research

  foundations_language_models:
    covers:
      - nlp
      - transformers-and-llms
    stage: graduate
    role: research

  foundations_alignment:
